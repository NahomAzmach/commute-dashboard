name: Commute check

on:
  schedule:
    # TEMPORARY: every 10 minutes, all day, every day - widened to speed up
    # accumulation of labeled training data for a future distilled model
    # (see lib/trainingLog.ts). Revert to the commute-window-only schedule
    # below once enough data has built up.
    # - cron: '*/10 13,14 * * 1-5'
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger commute check endpoint
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s --fail-with-body "$DASHBOARD_URL/api/cron/check?secret=$CRON_SECRET" -o response.json -w "\nstatus: %{http_code}\n" || curl_exit=$?
          cat response.json
          exit "${curl_exit:-0}"
