name: Commute check

on:
  # Scheduling moved to Upstash QStash (three schedules: commute-morning,
  # commute-evening, commute-offpeak), which actually honors the cadence -
  # GitHub's own `schedule` trigger did not reliably fire on time regardless
  # of the cron expression (observed gaps of 3-6 hours against a configured
  # 10-minute interval). Kept here only as a record and for manual runs.
  # schedule:
  #   - cron: '*/5 13-18 * * *'
  #   - cron: '*/5 22-23,0-3 * * *'
  #   - cron: '*/30 4-12,19-21 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger commute check endpoint
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s --fail-with-body "$DASHBOARD_URL/api/cron/check?secret=$CRON_SECRET" -o response.json -w "\nstatus: %{http_code}\n" || curl_exit=$?
          cat response.json
          exit "${curl_exit:-0}"
