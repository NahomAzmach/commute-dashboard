name: Commute check

on:
  schedule:
    # Commute-hour-weighted collection: a month of uniform 24/7 checks left
    # the rare classes (congested/stopped) thin - most of that time was spent
    # logging overnight/midday hours where nothing happens. These three
    # entries partition all 24 UTC hours with no gap and no overlap:
    # every 5 min during commute windows (covers both PST and PDT, ~6-10am
    # and ~3-7pm Pacific), every 30 min otherwise - still well under the
    # 2-hour frame-differencing baseline TTL during off-peak.
    - cron: '*/5 13-18 * * *'
    - cron: '*/5 22-23,0-3 * * *'
    - cron: '*/30 4-12,19-21 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger commute check endpoint
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s --fail-with-body "$DASHBOARD_URL/api/cron/check?secret=$CRON_SECRET" -o response.json -w "\nstatus: %{http_code}\n" || curl_exit=$?
          cat response.json
          exit "${curl_exit:-0}"
